# ==============================================================================
# ModSecurity Custom Web Application Firewall (WAF) Rules for PrestaShop
# Lab: Web Application & Endpoint Security (Attack Simulation & Defense)
# Author: Qazeem Samsudeen Temitope (BlaqqSec)
# Environment: PrestaShop 1.7.8.9 (Docker) protected by Apache ModSecurity Reverse Proxy
# ==============================================================================

# ------------------------------------------------------------------------------
# RULE 1000001: Cross-Site Scripting (XSS) Prevention
# Phase 2: Inspects URL query parameters, form data, cookies, and HTTP headers.
# Purpose: Blocks common HTML tags, inline scripts, JavaScript event triggers, 
#          and popup alerts injected into input fields (e.g. search bar, comments).
# ------------------------------------------------------------------------------
SecRule ARGS|REQUEST_COOKIES|REQUEST_HEADERS "@rx (?i)(<script[^>]*>.*?</script>|<script|javascript:|onload=|onerror=|alert\(|<svg[^>]*onload)" \
    "id:1000001,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'[DEFENSE BLOCKED] Cross-Site Scripting (XSS) Attack Detected',\
    severity:CRITICAL"

# ------------------------------------------------------------------------------
# RULE 1000002: SQL Injection (SQLi) Prevention
# Phase 2: Inspects user inputs and URL requests.
# Purpose: Blocks unauthorized database manipulation attempts, such as UNION SELECT,
#          always-true conditions (' OR 1=1), inline comment syntax, and DROP TABLE.
# ------------------------------------------------------------------------------
SecRule ARGS|REQUEST_URI "@rx (?i)(\b(union(\s+all)?\s+select|select.*from|insert\s+into|drop\s+table)\b|--\s*|'\s*or\s*'1'='1|'\s*or\s*1=1)" \
    "id:1000002,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'[DEFENSE BLOCKED] SQL Injection (SQLi) Signature Detected',\
    severity:CRITICAL"

# ------------------------------------------------------------------------------
# RULE 1000003: Sensitive File and Directory Traversal Prevention
# Phase 1: Inspects the request URI before passing it to the application backend.
# Purpose: Stops attackers from crawling backwards through folders (../) to read
#          critical files like /etc/passwd, database config (settings.inc.php), or .env.
# ------------------------------------------------------------------------------
SecRule REQUEST_URI|ARGS "@rx (?i)(\.\./\.\./|etc/passwd|config/settings\.inc\.php|\.env|\.git)" \
    "id:1000003,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'[DEFENSE BLOCKED] Directory Traversal or Sensitive File Access',\
    severity:HIGH"

# ------------------------------------------------------------------------------
# RULE 1000004: Protection of Leftover PrestaShop Installer Directory
# Phase 1: Inspects the URL path immediately.
# Purpose: Prevents unauthorized visitors or attackers from triggering the /install/
#          wizard again, which would overwrite the database or take over the store.
# ------------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/install/" \
    "id:1000004,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'[DEFENSE BLOCKED] Unauthorized Access to PrestaShop /install/ Path',\
    severity:WARNING"
